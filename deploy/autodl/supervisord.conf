[unix_http_server]
file=/root/autodl-tmp/itp-data/supervisor.sock
chmod=0700

[supervisord]
logfile=/root/autodl-tmp/itp-data/supervisord.log
pidfile=/root/autodl-tmp/itp-data/supervisord.pid
childlogdir=/root/autodl-tmp/itp-data
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///root/autodl-tmp/itp-data/supervisor.sock

[program:itp-api]
command=/root/autodl-tmp/itp-app/.venv/bin/uvicorn itp.api:create_app --factory --host 127.0.0.1 --port 8000 --workers 1
directory=/root/autodl-tmp/itp-app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/itp-data/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:itp-nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/itp-data/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; The two model services are started last, so the site answers as soon as the
; API and Nginx are up. Both wait for a GPU device node before loading weights.
; ITP_KLEIN_OFFLOAD=model keeps peak VRAM near one component; use "none" on a
; GPU large enough to hold all ~15 GB of weights. ITP_KLEIN_MODEL_PATH points
; at the downloaded snapshot so no hub lookup is attempted at boot.
[program:itp-flux]
command=/root/autodl-tmp/itp-app/deploy/autodl/run-model-service.sh ITP_KLEIN_API_TOKEN /root/autodl-tmp/itp-flux-klein-service/.token /root/autodl-tmp/itp-flux-klein-service/scripts/start.sh
directory=/root/autodl-tmp/itp-flux-klein-service
environment=ITP_KLEIN_GPU="0",ITP_KLEIN_OFFLOAD="model",ITP_KLEIN_MODEL_PATH="/root/autodl-tmp/itp-flux-klein-service/hf-cache/hub/models--black-forest-labs--FLUX.2-klein-4B/snapshots/e7b7dc27f91deacad38e78976d1f2b499d76a294",HF_HUB_OFFLINE="1"
autostart=true
autorestart=true
startsecs=30
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/itp-data/flux.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:itp-faceverse]
command=/root/autodl-tmp/itp-app/deploy/autodl/run-model-service.sh ITP_FACEVERSE_API_TOKEN /root/autodl-tmp/itp-data/faceverse.token /root/autodl-tmp/itp-app/services/faceverse/scripts/start.sh
directory=/root/autodl-tmp/itp-app/services/faceverse
autostart=true
autorestart=true
startsecs=30
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/itp-data/faceverse.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
